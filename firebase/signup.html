<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Page</title>
<link rel="stylesheet" href="style.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#273c75,#40739e);
}

.signup-container{
    background:#fff;
    width:350px;
    padding:40px 30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.signup-container h2{
    text-align:center;
    margin-bottom:10px;
    color:#273c75;
}

.signup-container p{
    text-align:center;
    margin-bottom:25px;
    color:#777;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#273c75;
    outline:none;
}

.btn{
    width:100%;
    padding:12px;
    background:#273c75;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#192a56;
}

.login-link{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.login-link a{
    color:#273c75;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">MyHomePage</div>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./signup.html">Sign Up</a></li>
            <li><a href="./login.html" id="login-form">Login</a></li>
        </ul>
        <div class="profile" id="navbarProfile" style="display:none;">
            <img id="navbarAvatar" src="" alt="User" style="display:none;">
            <span id="navbarUser"></span>
            <button id="navbarLogout" style="background:#fff;color:#273c75;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-weight:bold;">Sign Out</button>
        </div>
    </nav>
<div class="signup-container">
    <h2>Create Account</h2>
    <p>Sign up to get started</p>

    <form>

        <div class="input-group">
            <input type="email" placeholder="Email" required id="semail">
        </div>

        <div class="input-group">
            <input type="password" placeholder="Password" required id="spassword">
        </div>

        <button class="btn" id="btnSignup"  type="button">Sign Up</button>
       
    </form>

    <div class="login-link">
        Already have an account? <a href="./login.html">Login</a>
         <button class="btn" id="btnGoogleSignup" type="button" style="background:#fff;color:#273c75;border:1px solid #273c75;display:flex;align-items:center;justify-content:center;margin-top:10px;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:20px;height:20px;margin-right:8px;"> Sign Up with Google
        </button>
    </div>
</div>
<script src="./app.js" type="module"></script>
</body>
</html>
