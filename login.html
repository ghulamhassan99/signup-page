<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link rel="stylesheet" href="style.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#192a56,#273c75);
}

.login-container{
    background:#fff;
    width:350px;
    padding:40px 30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-container h2{
    text-align:center;
    margin-bottom:10px;
    color:#192a56;
}

.login-container p{
    text-align:center;
    margin-bottom:25px;
    color:#777;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#192a56;
    outline:none;
}

.btn{
    width:100%;
    padding:12px;
    background:#192a56;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#0f1c3f;
}

.signup-link{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.signup-link a{
    color:#192a56;
    text-decoration:none;
    font-weight:bold;
}

.forgot{
    text-align:right;
    font-size:13px;
    margin-bottom:15px;
}

.forgot a{
    color:#555;
    text-decoration:none;
}
</style>
</head>

<body>

        <nav class="navbar">
        <div class="logo">MyHomePage</div>
        <ul>
                  <li><a href="./index.html">Home</a></li>
            <li><a href="./signup.html">Sign Up</a></li>
            <li><a href="./login.html" id="login-form">Login</a></li>
        </ul>
        <div class="profile" id="navbarProfile" style="display:none;">
            <img id="navbarAvatar" src="" alt="User" style="display:none;">
            <span id="navbarUser"></span>
            <button id="navbarLogout" style="background:#fff;color:#273c75;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-weight:bold;">Sign Out</button>
        </div>
    </nav>
<div class="login-container">
    <h2>Welcome Back</h2>
    <p>Login to continue</p>

    <form>
        <div class="input-group">
            <input type="email" placeholder="Email" required  id="lemail">
        </div>

        <div class="input-group">
            <input type="password" placeholder="Password" required id="lpassword">
        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="btn" id="btnLogin" type="button">Login</button>
    </form>

    <div class="signup-link">
        Don't have an account? <a href="./signup.html">Sign Up</a>
    </div>
</div>
<script src="./app.js" type="module"></script>
</body>
</html>
